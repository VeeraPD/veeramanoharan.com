name: Deploy to GitHub Pages

# The live site is the static prototype/ folder. Only the published pages and
# their assets are copied; build scripts and archived variants (v3-v5) stay out.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp prototype/index.html prototype/case-*.html prototype/case.css prototype/case.js _site/
          cp -r prototype/images _site/
          if [ -n "$(ls -A prototype/videos 2>/dev/null)" ]; then cp -r prototype/videos _site/; fi
          echo "veeramanoharan.com" > _site/CNAME
          touch _site/.nojekyll
          ls -R _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
